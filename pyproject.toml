[tool.poetry]
name = "SIM-Collocation"
version = "0.1.0"
description = "SIMULATING COMPETITIVE COLLOCATION STRATEGIES WITH DEEP REINFORCEMENT LEARNING"
authors = ["The Author"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = ">=3.10,<3.11"
numpy = "1.26.4"
pettingzoo = "1.24.3"
torch = "2.4.1"
matplotlib = "3.9.2"
pandas = "2.2.2"
pyarrow = "23.0.1"
fastparquet = "2026.3.0"
lightgbm = "4.6.0"
shap = "0.49.1"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
